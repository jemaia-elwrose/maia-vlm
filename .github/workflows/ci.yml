name: ci
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Redis (Linux; the live tests skip without it)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y redis-server && sudo systemctl start redis-server
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check --output-format=github . && ruff format --check --diff .
      - name: Test
        run: pytest -q -rs
        env:
          REDIS_URL: redis://localhost:6379/15
