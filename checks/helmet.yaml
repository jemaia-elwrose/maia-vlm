id: helmet
version: 4
title: Is the person wearing a hard hat?
applies_to:
  labels:
  - person
  - no-helmet
  - head
frames:
  count: 3
  window_s:
  - -1.0
  - 1.0
  crop: subject
  context: 0.4
prompt: |
  These are close-ups of {subject}, at a work site or on a vehicle.
  The alert says this person has NO hard hat (safety helmet) on.
  First set hard_hat: is a hard hat (a rigid helmet shell, any colour) on their head?
  - yes: a hard hat is on the head, even if a hood, cap or scarf is worn under it.
  - no: no hard hat on the head. A cap, hood, scarf or hair net on its own is not a hard hat, and neither is one held in the hand or hanging on a belt.
  - not_visible: the head is not visible clearly enough in any image.
  Then set head_covering to anything else on their head: cap_or_hood, none, or not_visible.
  Then judge the alert: confirmed if there is no hard hat (the alert is right), rejected if there is one (a false alarm), unclear if not visible.
  The description names what is on the person's head.
answer:
  type: object
  required:
  - hard_hat
  - head_covering
  - verdict
  - description
  additionalProperties: false
  properties:
    hard_hat:
      enum:
      - 'yes'
      - 'no'
      - not_visible
    head_covering:
      enum:
      - cap_or_hood
      - none
      - not_visible
    verdict:
      enum:
      - confirmed
      - rejected
      - unclear
    description:
      type: string
      maxLength: 200
    evidence:
      type: array
      maxItems: 1
      items:
        type: object
        required:
        - image
        - box
        additionalProperties: false
        properties:
          image:
            type: integer
            minimum: 1
          box:
            type: array
            items:
              type: number
            minItems: 4
            maxItems: 4
verdict_from:
  field: hard_hat
  map:
    'yes': rejected
    'no': confirmed
    not_visible: unclear
