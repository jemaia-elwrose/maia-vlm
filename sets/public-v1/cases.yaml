# Public set v1: real events and close-call negatives for five checks, from public datasets,
# Pexels stock footage and recorded test footage (see SOURCES.md).
# Clips in media/ (git-ignored); 'at' is the moment of the event in each clip, as measured when
# it was cut (scripts/prepare-clip.sh: moment - start). Boxes come from YOLO at that moment.
#
#   maia-vlm run sets/public-v1/cases.yaml --infer tcp://localhost:5555 --save-images
media: media
defaults: {fps: 5, box: auto, label: person}

cases:
  # --- fall
  - {id: fall-pos-01, clip: fall-pos-01.mp4, check: fall, at: 5.0, expect: confirmed, note: "a fall"}
  - {id: fall-pos-02, clip: fall-pos-02.mp4, check: fall, at: 5.0, expect: confirmed, note: "a fall"}
  - {id: fall-pos-03, clip: fall-pos-03.mp4, check: fall, at: 5.0, expect: confirmed, note: "a fall"}
  - {id: fall-pos-04, clip: fall-pos-04.mp4, check: fall, at: 5.0, expect: confirmed, note: "a fall"}
  - {id: fall-pos-05, clip: fall-pos-05.mp4, check: fall, at: 5.0, expect: confirmed, note: "a fall (edge case)"}
  - {id: fall-neg-01, clip: fall-neg-01.mp4, check: fall, at: 5.0, expect: rejected, note: "not fall: bending over"}
  - {id: fall-neg-02, clip: fall-neg-02.mp4, check: fall, at: 4.0, expect: rejected, note: "not fall: bending over"}
  - {id: fall-neg-03, clip: fall-neg-03.mp4, check: fall, at: 4.0, expect: rejected, note: "not fall: lying down"}
  - {id: fall-neg-04, clip: fall-neg-04.mp4, check: fall, at: 4.0, expect: rejected, note: "not fall: sitting down"}
  - {id: fall-neg-05, clip: fall-neg-05.mp4, check: fall, at: 3.5, expect: rejected, note: "not fall: sitting down"}
